<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interview Prep Sheet</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--card2:#1e2740;--tx:#eaf0ff;--mut:#98a6c8;--acc:#5b8cff;--ok:#3ddc97;--warn:#ffc857;--line:#2a3554}
@media (prefers-color-scheme: light){:root{--bg:#f3f6fc;--card:#fff;--card2:#eef3ff;--tx:#15203a;--mut:#5a6785;--acc:#2f5fe0;--ok:#0e9f6e;--warn:#b7791f;--line:#d9e1f2}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
header{padding:28px 16px 10px;max-width:900px;margin:auto}
h1{margin:0 0 4px;font-size:28px}
.sub{color:var(--mut)}
nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;overflow-x:auto;white-space:nowrap}
nav a{display:inline-block;margin-right:8px;padding:6px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--tx);text-decoration:none;font-size:14px;font-weight:600}
nav a:hover{border-color:var(--acc);color:var(--acc)}
main{max-width:900px;margin:auto;padding:8px 16px 80px}
section{margin-top:34px;scroll-margin-top:60px}
h2{font-size:22px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2 .n{background:var(--acc);color:#fff;border-radius:8px;width:30px;height:30px;display:grid;place-items:center;font-size:15px;flex:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:16px;color:var(--acc)}
.card p{margin:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--warn);margin-left:6px}
.say{background:var(--card2);border-left:4px solid var(--ok);border-radius:10px;padding:12px 14px;margin-top:8px}
.say b{color:var(--ok);font-size:12px;letter-spacing:.06em;display:block;margin-bottom:2px}
details.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
details.q summary{cursor:pointer;font-weight:700;list-style:none}
details.q summary::-webkit-details-marker{display:none}
details.q summary::before{content:"+";display:inline-block;width:22px;color:var(--acc);font-weight:800}
details.q[open] summary::before{content:"-"}
.steps{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));counter-reset:s}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;margin-bottom:8px}
.step b{display:block}
.step span{color:var(--mut);font-size:15px}
.phr{display:grid;gap:8px}
.phr div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:600}
.big{background:linear-gradient(135deg,var(--acc),#7c5bff);color:#fff;border-radius:16px;padding:20px;font-size:20px;font-weight:700;text-align:center}
.terms{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.terms div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.terms b{color:var(--acc)}
.note{color:var(--mut);font-size:14px;margin-top:8px}
.ask li{margin-bottom:8px}
.checklist label{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.checklist input{margin-right:10px;transform:scale(1.3)}
.todo{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub" id="sub"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script src="data.js"></script>
<script>
(function(){
  var D = window.INTERVIEW || {};
  var main = document.getElementById('main');
  var nav = document.getElementById('nav');
  var n = 0;

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text != null) e.textContent = text;
    return e;
  }
  function say(label, text){
    var d = el('div','say');
    d.appendChild(el('b',null,label));
    d.appendChild(document.createTextNode(text));
    return d;
  }
  function section(id, title){
    var s = el('section'); s.id = id;
    var h = el('h2'); n++;
    h.appendChild(el('span','n',String(n)));
    h.appendChild(document.createTextNode(title));
    s.appendChild(h);
    main.appendChild(s);
    var a = el('a',null,title); a.href = '#'+id; nav.appendChild(a);
    return s;
  }
  function cards(list){
    var g = el('div','grid');
    (list||[]).forEach(function(c){
      var d = el('div','card');
      var h = el('h3',null,c.title);
      if(c.tag) h.appendChild(el('span','tag',c.tag));
      d.appendChild(h);
      d.appendChild(el('p',null,c.text));
      g.appendChild(d);
    });
    return g;
  }
  function qa(list){
    var f = document.createDocumentFragment();
    (list||[]).forEach(function(x){
      var d = el('details','q');
      d.appendChild(el('summary',null,x.q));
      d.appendChild(say('SAY', x.a));
      f.appendChild(d);
    });
    return f;
  }

  var meta = D.meta || {};
  var t = (meta.company ? meta.company + ' ' : '') + (meta.role || 'Interview') + ' Interview';
  document.getElementById('title').textContent = t;
  document.title = t;
  document.getElementById('sub').textContent = meta.tagline || 'Tap any question to open the answer. Say it in your own words, keep it short.';

  if(D.golden){
    var g = el('section'); g.id = 'golden';
    g.appendChild(el('div','big',D.golden));
    g.appendChild(el('p','note','If you forget everything else, use this on every scenario question.'));
    main.appendChild(g);
    var a = el('a',null,'Golden rule'); a.href = '#golden'; nav.appendChild(a);
  }

  if(D.company){
    var s = section('company', D.company.title || 'The company');
    s.appendChild(cards(D.company.cards));
    if(D.company.say) s.appendChild(say(D.company.say.q, D.company.say.a));
  }
  if(D.role){
    var s2 = section('role', D.role.title || 'The role');
    s2.appendChild(cards(D.role.cards));
    if(D.role.say) s2.appendChild(say(D.role.say.q, D.role.say.a));
  }
  if(D.method){
    var s3 = section('method', D.method.title || 'Your method');
    var st = el('div','steps');
    (D.method.steps||[]).forEach(function(x){
      var d = el('div','step'); d.appendChild(el('b',null,x.t)); d.appendChild(el('span',null,x.d)); st.appendChild(d);
    });
    s3.appendChild(st);
    if(D.method.phrases){
      s3.appendChild(el('h3',null,'Phrases you can reuse')).style.margin = '22px 0 10px';
      var p = el('div','phr');
      D.method.phrases.forEach(function(x){ p.appendChild(el('div',null,x)); });
      s3.appendChild(p);
    }
  }
  (D.sections||[]).forEach(function(sec, i){
    var s4 = section('sec'+i, sec.title);
    s4.appendChild(qa(sec.items));
  });
  if(D.ask){
    var s5 = section('ask', 'Questions YOU ask them');
    var c = el('div','card'); var ul = el('ul','ask');
    D.ask.forEach(function(x){ ul.appendChild(el('li',null,x)); });
    c.appendChild(ul); s5.appendChild(c);
    if(D.askNote) s5.appendChild(el('p','note',D.askNote));
  }
  if(D.terms){
    var s6 = section('terms', 'Quick word list');
    var tg = el('div','terms');
    D.terms.forEach(function(x){
      var d = el('div'); d.appendChild(el('b',null,x.t)); d.appendChild(document.createTextNode(': '+x.d)); tg.appendChild(d);
    });
    s6.appendChild(tg);
    if(D.termsNote) s6.appendChild(el('p','note',D.termsNote));
  }
  if(D.checklist){
    var s7 = section('before', 'Right before the call');
    s7.className = 'checklist';
    D.checklist.forEach(function(x){
      var l = el('label'); var i = el('input'); i.type = 'checkbox';
      l.appendChild(i); l.appendChild(document.createTextNode(x)); s7.appendChild(l);
    });
  }
})();
</script>
</body>
</html>
